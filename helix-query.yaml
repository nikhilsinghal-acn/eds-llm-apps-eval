version: 1

indices:
  default:
    include:
      - '/**'
    exclude:
      - '/eds-widgets/**'
      - '/drafts/**'
    target: /query-index.json
    properties:
      title:
        select: head > title
        value: |
          textContent(el)
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers('last-modified'), 'ddd, DD MMM YYYY hh:mm:ss GMT')
